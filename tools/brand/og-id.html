<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:J;src:url(../../src/fonts/plus-jakarta-sans-400.woff2);font-weight:400}
@font-face{font-family:J;src:url(../../src/fonts/plus-jakarta-sans-600.woff2);font-weight:600}
@font-face{font-family:J;src:url(../../src/fonts/plus-jakarta-sans-600-italic.woff2);font-weight:600;font-style:italic}
@font-face{font-family:M;src:url(../../src/fonts/fragment-mono-400.woff2)}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{font-family:J;color:#430719;background:radial-gradient(55% 75% at 82% 50%,rgb(112 2 15/.10),transparent 70%),#fff;display:flex;align-items:center;gap:72px;padding:0 96px;box-sizing:border-box}
.mark{width:260px;height:260px;flex:none}
.pill{display:inline-flex;align-items:center;gap:12px;padding:10px 20px;border-radius:99px;background:rgb(112 2 15/.06);box-shadow:inset 0 0 0 1.5px rgb(112 2 15/.25);font-size:22px}

p{margin:30px 0 0;font-size:34px;line-height:1.3;letter-spacing:-.01em;color:#5c6063}
p em{font-style:italic;font-weight:600;color:#70020f}
</style></head><body>
<img class="mark" src="../../public/brand/bliss-mark.svg" alt="">
<div><span class="pill"><i></i>Agensi Digital Marketing · Jakarta</span><h1>Bliss <em>Digital</em></h1><p>Orang yang tepat. Waktu yang tepat. <em>Pesan yang tepat.</em></p></div>
</body></html>
